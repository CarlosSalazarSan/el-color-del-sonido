<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El sonido del color</title>

  <!-- CSS -->
  <link rel="stylesheet" href="estilos.css" />

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/addons/p5.sound.min.js" defer></script>
  <script src="aplicacion.js" defer></script>
  <!-- js para incluir footer y cabecera -->
  <script src="incluir-partes.js" defer></script>
</head>

<body>

  <!-- cabecera/header -->
   <div id="contenedor-cabecera"></div>


  <!-- contenedor principal -->
  <main class="contenido-principal">
    <section class="seccion-central">
      <div class="tarjeta-central">

        <!-- contenedor juego -->
        <div id="contenedor-juego" class="contenedor-juego"></div>

        <!--pantalla bienvenida -->
        <div id="pantalla-bienvenida" class="pantalla-bienvenida">
          <p class="titulo-bienvenida">Bienvenidos a el sonido del color</p>
          <p class="subtitulo-bienvenida">¿Quieres mejorar tus habilidades auditivas?</p>
          <button id="boton-inicio" class="boton-primario">INICIO</button>
        </div>

      </div>
    </section>
  </main>


  <!-- footer-->
  <div id="contenedor-footer"></div>


  <!-- Script para cargar el código html antes de iniciar JS -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const botonInicio = document.getElementById("boton-inicio");
      const pantalla = document.getElementById("pantalla-bienvenida");

      botonInicio.addEventListener("click", () => {
        pantalla.style.opacity = "0";
        pantalla.style.pointerEvents = "none";
      });
    });
  </script>


</body>
</html>
